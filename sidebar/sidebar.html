<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ollama Assistant</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0c0c0c;
      --surface:  #141414;
      --surface2: #1c1c1c;
      --border:   #252525;
      --accent:   #e8ff00;
      --accent2:  #00ffcc;
      --text:     #e0e0e0;
      --muted:    #555;
      --user-bg:  #1e1e1e;
      --ai-bg:    #121212;
      --font-mono: 'DM Mono', 'Fira Code', monospace;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --radius:   8px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.6;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ── */
    #header {
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .logo-mark {
      width: 20px;
      height: 20px;
      background: var(--accent);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: #000;
      flex-shrink: 0;
    }

    #header-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.04em;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #clear-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 2px 6px;
      border-radius: 4px;
    }

    #clear-btn:hover { color: var(--text); background: var(--surface2); }

    /* ── Context banner ── */
    #context-banner {
      display: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 14px;
      font-size: 11px;
      color: var(--muted);
      font-family: var(--font-mono);
      flex-shrink: 0;
    }

    #context-banner.visible { display: flex; align-items: center; gap: 8px; }

    .context-tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 10px;
      color: var(--accent2);
      letter-spacing: 0.05em;
    }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 100%;
      animation: fadeSlide 0.2s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-role {
      font-size: 9px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 4px;
      margin-top: 12px;
    }

    .msg-bubble {
      padding: 10px 12px;
      border-radius: var(--radius);
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .msg-role { color: var(--accent); }
    .msg.user .msg-bubble {
      background: var(--user-bg);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .msg.assistant .msg-role { color: var(--accent2); }
    .msg.assistant .msg-bubble {
      background: var(--ai-bg);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .msg.assistant .msg-bubble code {
      font-family: var(--font-mono);
      background: var(--surface2);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 12px;
    }

    .msg.assistant .msg-bubble pre {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 12px;
      font-family: var(--font-mono);
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent2);
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── Error ── */
    .msg.error .msg-bubble {
      background: #1a0808;
      border-color: #4a1a1a;
      color: #ff6b6b;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    /* ── Empty state ── */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 24px;
      text-align: center;
    }

    #empty-state .big-o {
      font-size: 40px;
      font-family: var(--font-mono);
      color: var(--border);
      line-height: 1;
      margin-bottom: 4px;
    }

    #empty-state p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ── Input area ── */
    #input-area {
      border-top: 1px solid var(--border);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      background: var(--bg);
    }

    #textarea-wrap {
      position: relative;
    }

    #user-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      padding: 9px 40px 9px 12px;
      resize: none;
      outline: none;
      min-height: 40px;
      max-height: 140px;
      overflow-y: auto;
      transition: border-color 0.15s;
    }

    #user-input:focus { border-color: var(--accent); }
    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 26px;
      height: 26px;
      background: var(--accent);
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, opacity 0.15s;
    }

    #send-btn:hover { background: #d4e800; }
    #send-btn:disabled { opacity: 0.35; cursor: default; }

    #send-btn svg { display: block; }

    .input-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    #model-label { letter-spacing: 0.05em; }

    #stop-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      display: none;
    }

    #stop-btn.visible { display: block; }
    #stop-btn:hover { border-color: #ff6b6b; color: #ff6b6b; }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div class="logo-mark">○</div>
      <span id="header-title">Ollama Assistant</span>
      <button id="clear-btn" title="Clear chat">clear</button>
    </div>

    <div id="context-banner">
      <span class="context-tag" id="ctx-tag"></span>
      <span id="ctx-desc"></span>
    </div>

    <div id="messages">
      <div id="empty-state">
        <div class="big-o">○</div>
        <p>Ask a question or<br />summarize the page.</p>
      </div>
    </div>

    <div id="input-area">
      <div id="textarea-wrap">
        <textarea id="user-input" placeholder="Ask anything…" rows="1"></textarea>
        <button id="send-btn" title="Send">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 10L10 6L2 2V5.5L7 6L2 6.5V10Z" fill="#000"/>
          </svg>
        </button>
      </div>
      <div class="input-meta">
        <span id="model-label">—</span>
        <button id="stop-btn">■ stop</button>
      </div>
    </div>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
